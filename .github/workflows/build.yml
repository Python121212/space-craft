name: Forge 1.20.1 ビルド

on:
  push:
    branches:
      - main
      - 'arena/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: 'build-${{ github.ref }}'
  cancel-in-progress: true

jobs:
  build:
    name: JDK 17 + Gradle 8.1.1 でビルド
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      # すべて Node.js 24 対応のメジャーに統一しています（Node 20 の非推奨警告を出さないため）。
      # gradle/actions は v6 でキャッシュが Gradle 独自の利用規約に変わるため、
      # MIT のまま Node 24 に対応した v5 を採用しています。
      - name: チェックアウト
        uses: actions/checkout@v7

      - name: JDK 17 を準備
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.1.1 を準備
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.1.1'

      - name: gradle build を実行
        run: gradle build --no-daemon --stacktrace

      - name: 生成された JAR を検査
        run: |
          set -euo pipefail
          JAR=$(ls build/libs/*.jar | head -n 1)
          echo "::notice::ビルド成果物: $JAR"
          jar tf "$JAR"
          echo "--- META-INF/mods.toml ---"
          unzip -p "$JAR" META-INF/mods.toml
          echo "--- pack.mcmeta ---"
          unzip -p "$JAR" pack.mcmeta
          unzip -p "$JAR" META-INF/mods.toml | grep -F 'modId="spacecraft"'

      - name: mod JAR を Artifact として保存
        uses: actions/upload-artifact@v7
        with:
          name: spacecraft-1.20.1-forge
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 30

      - name: GitHub Release に jar を添付
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(grep '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          TAG="v${VERSION}"
          JAR=$(ls build/libs/*.jar | head -n 1)
          NOTES="Minecraft 1.20.1 / Forge 47.x 向けの空の mod です。JDK 17 + Gradle 8.1.1 でビルドした jar を添付しています。ブロック・アイテムなどは未登録で、Forge が mod として読み込むことだけを確認する jar です。Forge 47.x の mods/ に置いて起動すると、Mods 一覧に Space Craft と表示されます。"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "既存リリース $TAG のアセットを差し替えます"
            gh release upload "$TAG" "$JAR" --clobber
          else
            echo "リリース $TAG を新規作成します"
            gh release create "$TAG" "$JAR" --title "Space Craft $TAG" --notes "$NOTES"
          fi

          gh release view "$TAG" --json tagName,assets --jq '{tagName, assets:[.assets[].name]}'
